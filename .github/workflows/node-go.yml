name: node-go

# halo-node (packages/node-go): the machine-side client for linked machines.
# Release: attaches Linux / macOS / Windows binaries + SHA256SUMS + install.sh to the GitHub release.
on:
  pull_request:
    branches: [main]
    # node-go itself, plus what the rm-guard vector --check imports (sandbox.ts → child-env.ts,
    # through the lockfile's tsx) and the protocol.ts the internal/protocol drift test reads.
    paths: &paths
      - packages/node-go/**
      - packages/server/src/nodes/protocol.ts
      - packages/server/src/tools/sandbox.ts
      - packages/server/src/child-env.ts
      - pnpm-lock.yaml
      - .github/workflows/node-go.yml
  push:
    branches: [main]
    paths: *paths
  release:
    types: [published]
  # Re-run the attach for an already-published tag that contains packages/node-go/
  # (e.g. the release event run failed). Tags before the Go port can't build.
  workflow_dispatch:
    inputs:
      tag: { required: true, description: "v2.2.0" }

permissions: { contents: read }

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: packages/node-go/go.mod, cache-dependency-path: packages/node-go/go.sum }
      - run: corepack enable
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: go vet + go test
        run: cd packages/node-go && go vet ./... && go test ./...
      - run: shellcheck packages/node-go/install.sh
      # rmguard vectors must still equal what the current TS assertRmSafe says (needs server's tsx).
      - run: node packages/node-go/testgen/gen-rmguard-vectors.mjs --check
      - name: regex differential fuzz (20k patterns, seed = run id)
        run: |
          node packages/node-go/testgen/regex-fuzz.mjs --n 20000 --seed ${{ github.run_id }} > /tmp/re.jsonl
          cd packages/node-go && JSREGEX_VECTORS=/tmp/re.jsonl go test ./internal/jsregex -run Differential -v -count=1
      - run: cd packages/node-go && VER=dev-${GITHUB_SHA::7} ./build.sh
      # -static registers binfmt: the tests re-exec their own (arm) binary, which -exec can't wrap.
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 && test -e /proc/sys/fs/binfmt_misc/qemu-arm
      - name: go test (arm64 under qemu)
        run: cd packages/node-go && GOARCH=arm64 go test ./...
      - name: go test (armv7 under qemu)
        run: cd packages/node-go && GOARCH=arm GOARM=7 go test ./...

  windows:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/node-go
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: packages/node-go/go.mod, cache-dependency-path: packages/node-go/go.sum }
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build -trimpath -o dist/halo-node-windows-amd64.exe ./cmd/halo-node
      - run: ./dist/halo-node-windows-amd64.exe --version

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-go@v7
        with: { go-version-file: packages/node-go/go.mod, cache-dependency-path: packages/node-go/go.sum }
      # The only gate on release events (the test job doesn't run): fail → nothing attached.
      - run: cd packages/node-go && go vet ./... && go test ./...
      - run: cd packages/node-go && VER=${TAG#v} ./build.sh
      # install.sh downloads this tag's binaries; it's the piped entry point, so not in SHA256SUMS.
      - run: |
          sed "s/__HALO_VERSION__/${TAG#v}/" packages/node-go/install.sh > packages/node-go/dist/install.sh
          if grep -n __HALO_VERSION__ packages/node-go/dist/install.sh; then echo "::error::install.sh not stamped"; exit 1; fi
      - run: gh release upload "$TAG" packages/node-go/dist/halo-node-linux-* packages/node-go/dist/halo-node-darwin-* packages/node-go/dist/halo-node-windows-amd64.exe packages/node-go/dist/SHA256SUMS packages/node-go/dist/install.sh --clobber
