  # Grok 4.6 (Bedrock launch 2026-08-18). 500K context per the Bedrock model
  # card and xAI's model page (input beyond 200K bills at 2x — cap
  # context.maxTokens in agent.yaml unless that's intended). Max output isn't
  # disclosed by either (the endpoint accepts any max_output_tokens without
  # validation) — 64000 is the same conservative carry-over used for GPT-5.6.
  # Live-probed 2026-09-24: reasoning.effort accepts ONLY low/medium/high/xhigh
  # (`none` and `max` → 400 "unsupported"), so no Max preset here; verbosity
  # low/medium/high, image input OK ("blue"), function_call OK. Global CRIS
  # pricing $2 / $6 per 1M (cache read $0.50).
  - id: global.xai.grok-4.6
    displayName: Grok 4.6
    maxOutputTokens: 64000
    contextWindow: 500000
