          - { value: medium, label: Medium }
          - { value: high, label: High }

  # Kimi K3 (Bedrock launch 2026-09-18, INFERENCE_PROFILE only — no in-Region
  # id). 1M context per the Bedrock model card; 131072 max output carried over
  # from the native kimi.yaml (Moonshot's official default cap). Live-probed
  # 2026-09-24: reasoning.effort accepts none/low/medium/high/xhigh/max (none →
  # reasoning_tokens 0; the others differ only within noise on short prompts,
  # so treat the ladder as advisory), text.verbosity low/medium/high, image
  # input OK (64×64 blue PNG → "Blue"), function_call OK. Global CRIS pricing
  # $3 / $15 per 1M (cache read $0.30, cache write $3.75). AWS notes images
  # answer better when placed before text in a mixed input.
  - id: global.moonshotai.kimi-k3
    displayName: Kimi K3
    maxOutputTokens: 131072
    contextWindow: 1048576
