  # Grok 4.7 (Bedrock launch 2026-09-28; global. / us. profiles only, no
  # in-Region id) — self-verification on long tasks, better use of its 500K
  # context. bedrock-runtime only: the model card lists no bedrock-mantle and
  # Mantle 404s it in us-east-1 / us-east-2 / us-west-2 (live-probed
  # 2026-10-08), so it isn't in aws-bedrock-mantle.yaml. Max output isn't
  # disclosed (the endpoint accepts any max_output_tokens) — 64000 carried
  # over from Grok 4.6. Live-probed 2026-10-08: reasoning.effort accepts ONLY
  # low/medium/high/xhigh (`none` and `max` → 400 "unsupported"), same as
  # 4.6 — so no Max preset; the card's server default is high, the form
  # default stays medium like 4.6. text.verbosity low/medium/high, image
  # input OK ("Red"), function_call OK, implicit caching OK (run 2-3
  # cached_tokens 8448 of 8531). Reachable from all four presets. Launch-week
  # capacity is flaky: many calls 500/503, or stream an `error` +
  # `response.failed` frame (server_error / rate_limit_exceeded) right after
  # response.in_progress, and succeed on a resend. Global CRIS
  # pricing $2.00 / $6.00 per 1M (cache read $0.50); US Geo $2.20 / $6.60
  # (cache read $0.55).
  - id: global.xai.grok-4.7
    displayName: Grok 4.7
    maxOutputTokens: 64000
    contextWindow: 272000
    maxContextWindow: 500000
    compressAt: 0.9
    capabilities:
