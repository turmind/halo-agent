  # GLM 5.3 on Bedrock (launch 2026-10-05; global. / us. profiles only, no
  # in-Region id) — Z.AI's 744B-total / ~40B-active MoE for agentic coding.
  # The native API is in zhipu.yaml; this is the Bedrock route. Serving
  # surface, live-probed 2026-10-08: bedrock-runtime /openai/v1 Responses
  # (200 from all four presets, streaming + function_call OK) — Mantle 404s
  # it in every region (the card lists no bedrock-mantle either), Converse /
  # Invoke / chat-completions exist too but MantleAgent needs only Responses.
  # reasoning.effort: the validation error lists none/low/medium/high/xhigh/
  # max and all six return 200, reasoning_tokens rising with effort on a
  # primality prompt (0 / 398 / 458 / 454 / 634 / 792) — unlike the native
  # API's low/high/max. `none` gets no preset (MantleAgent maps it to high);
  # Thinking off omits the field and the model still thinks. text.verbosity
  # low/medium/high. Text-only: an input_image part isn't rejected but the
  # model says it can't see it, so image: false. Card: 1M context, 128K max
  # output (the endpoint doesn't validate max_output_tokens). Implicit
  # caching OK (run 1 cache_write_tokens 9023, runs 2-3 cached_tokens 9023).
  # The card marks access as limited to eligible customers (this account
  # has it). Pricing not yet in the AWS Price List API — see the Bedrock
  # pricing page.
