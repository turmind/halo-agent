id: aws-bedrock-mantle
runtime: bedrock-mantle
revision: 2026110501
displayName: AWS Bedrock Mantle (OpenAI GPT-6.1 / 6 / 5.6)
displayName_zh: AWS Bedrock Mantle（OpenAI GPT-6.1 / 6 / 5.6）
description: OpenAI GPT-6.1 (Sol / Terra), GPT-6 (Astra / Sol / Luna) and GPT-5.6 (Sol / Terra / Luna) on Amazon Bedrock via the bedrock-mantle endpoint (OpenAI Responses API only — not Converse/InvokeModel). Region-split — GPT-6.1 Sol / Terra and GPT-6 Sol / Luna are on us-east-1 only, Astra on us-east-1 and us-west-2.
description_zh: 通过 Bedrock Mantle 端点调用 OpenAI GPT-6.1（Sol / Terra）、GPT-6（Astra / Sol / Luna）与 GPT-5.6（Sol / Terra / Luna）（仅 OpenAI Responses API，不支持 Converse/InvokeModel）。按区域分布：GPT-6.1 Sol / Terra 与 GPT-6 Sol / Luna 仅 us-east-1，Astra 在 us-east-1 与 us-west-2。
# Mantle is a distinct endpoint from bedrock-runtime; the OpenAI surface lives
# under /openai/v1. Region split (live-probed 2026-09-24, gpt-6.1-sol
# 2026-09-30, gpt-6-astra on us-east-1 2026-10-22; 404 on the wrong endpoint):
#
#                us-east-1   us-east-2   us-west-2
#   gpt-6-astra      ✓           -           ✓   (us-east-1 probed 2026-10-22)
#   gpt-6-sol        ✓           -           -
#   gpt-6-luna       ✓           -           -
#   gpt-6.1-sol      ✓           -           -
#   gpt-6.1-terra    ✓           -           -   (probed 2026-10-27)
#   gpt-5.6-sol      ✓           ✓           -
#   gpt-5.6-terra    ✓           ✓           ✓
#   gpt-5.6-luna     ✓           ✓           ✓
#
# The matrix is machine-readable: each region-limited model carries its own
# `endpoints:` list (authoritative for that model — the agent form offers only
# those and switches the endpoint when a model isn't served on the current
# one); a model with no `endpoints:` (5.6 Terra / Luna) is served on every
# entry of `endpointPresets`. Keep the table and the lists in step.
#
# us-east-1 serves every model, so it is the default; existing us-east-2
# configs (5.6-era) keep working; us-west-2 still serves Astra (Standard tier
# only — AWS lists Astra's Ultrafast tier on Mantle us-east-1 only) and 5.6
# Terra / Luna. The endpoint is a per-agent pick.
#
# The same eight models are also in aws-bedrock-openai.yaml (bedrock-runtime
# host, `global.openai.*` ids, no region split) — AWS's recommended endpoint
# for new agents. Stay here only for Mantle-only features (server-side
# web_search, background inference), which the web-search skill relies on.
defaultEndpoint: https://bedrock-mantle.us-east-1.api.aws/openai/v1
endpointPresets:
  - https://bedrock-mantle.us-east-1.api.aws/openai/v1
  - https://bedrock-mantle.us-west-2.api.aws/openai/v1
  - https://bedrock-mantle.us-east-2.api.aws/openai/v1

defaultModelId: openai.gpt-6-sol

# Auth: a Bedrock long-term API key passed as a Bearer token. Generate at
# console → Bedrock → API keys → long-term. The default placeholder reads the
# AWS_BEARER_TOKEN_BEDROCK env var; leave the env unset and fill the key in
# Settings to store it in secrets/settings.yaml instead. resolveApiKey() reads
# `api_key`, so the bearer token flows straight to the agent with no extra wiring.
secrets:
  - key: api_key
    description: Bedrock long-term API key (sent as a Bearer token). Defaults to the AWS_BEARER_TOKEN_BEDROCK env var.
    description_zh: Bedrock 长期 API Key（作为 Bearer 令牌发送）。默认读取 AWS_BEARER_TOKEN_BEDROCK 环境变量。
    default: <<AWS_BEARER_TOKEN_BEDROCK>>
    secret: true

# capability notes for Mantle/OpenAI:
#   - image: input only (text/image in, text-only out — no audio/video/image gen)
#   - promptCaching: AUTOMATIC (prefix ≥1024 tok, ~5min idle TTL). No cache_control
#     is sent and there's no 1h option — single 5m preset reflects reality, the
#     runtime never writes cache control, it only reads cached_tokens back.
#   - thinking: adaptive via reasoning.effort = low|medium|high|xhigh|max (no
#     budget_tokens mode). Live-endpoint finding (2026-02): `max` is accepted and
#     echoed back verbatim by all three 5.6 models, yet the model-level validation
#     error text (rejecting e.g. `minimal`) lists only none/low/medium/high/xhigh —
#     max works in practice but isn't on the official list. It is NOT silently
#     downgraded: measured ~6% more reasoning_tokens than xhigh on identical
#     prompts, so the tier reaches the model — a nudge, not a doubling.
#   - reasoning summaries: with Thinking on MantleAgent sends reasoning:
#     { effort, summary: 'auto' } and shows output[].reasoning.summary
#     (summary_text) in the thinking panel, streamed live from
#     response.reasoning_summary_text.delta. Without the field the summary
#     stays empty while reasoning_tokens > 0. Live-probed 2026-11-05 (effort
#     low, a trivial prompt): GPT-6 Sol and Astra (us-east-1) return a summary;
#     GPT-6.1 Terra and GPT-5.6 Luna answer 200 with an empty one — it may be
#     empty on simple prompts, not "never". `auto` rather than `detailed`: one
#     detailed run (bedrock-runtime GPT-6 Sol) came back empty. A reply that
#     needs no reasoning ("hi") shows no thinking panel. Every GPT-6.x / 5.6
#     Bedrock model card lists "Reasoning Summaries (Responses API only)" for
#     bedrock-mantle.
#   - maxOutputTokens for the 5.6 variants: not disclosed in the 5.6 model card —
#     conservatively carried over from GPT-5.5's 64000.
models:
  # GPT-6 Astra — OpenAI's current flagship (Bedrock GA 2026-09-08). us-east-1
  # and us-west-2 endpoints (404 on us-east-2; us-east-1 live-probed 2026-10-22
  # and on the Bedrock model card). Context 1,050,000 / max output 128,000
  # per the Bedrock model card + OpenAI model page. Live-probed 2026-09-13
  # with invalid-value requests: reasoning.effort accepts none/low/medium/
  # high/xhigh/max (`max` now on the official list, unlike 5.6), text.verbosity
  # accepts low/medium/high — same surface as 5.6, so MantleAgent needs no
  # change. Pricing note: input beyond 272K tokens bills at 2x, so the huge
  # window is a ceiling, not a free lunch — contextWindow (the new-agent
  # default) stays at 272000; maxContextWindow is the real limit.
  - id: openai.gpt-6-astra
    displayName: GPT-6 Astra
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
      - https://bedrock-mantle.us-west-2.api.aws/openai/v1
    maxOutputTokens: 128000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol below — final-answer length; new agents get the default, a yaml without it sends low.
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-6 Sol / Luna (Bedrock GA 2026-09-22) — us-east-1 endpoint ONLY (404 on
  # us-east-2 / us-west-2). Same 1,050,000 context / 128,000 max output as
  # Astra per the OpenAI model pages; live-probed 2026-09-24 on us-east-1 with
  # invalid-value requests: reasoning.effort accepts none/low/medium/high/
  # xhigh/max, text.verbosity accepts low/medium/high — identical surface, so
  # MantleAgent needs no change. Sol ($2/$10) is the coding/agentic tier and
  # the new default; Luna ($0.10/$0.50) is the high-volume tier. The 272K→2x
  # input-price step noted on Astra applies here too.
  - id: openai.gpt-6-sol
    displayName: GPT-6 Sol
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
    maxOutputTokens: 128000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-6.1 Sol (Bedrock GA 2026-09-29) — us-east-1 endpoint ONLY (404 on
  # us-east-2 / us-west-2, live-probed 2026-09-30). reasoning.effort accepts
  # low/medium/high/xhigh/max — `none` 400s, unlike GPT-6 Sol, so no "none"
  # preset; text.verbosity low/medium/high; image input OK; 1M context /
  # 131,072 output per the Bedrock model card.
  - id: openai.gpt-6.1-sol
    displayName: GPT-6.1 Sol
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
    maxOutputTokens: 131072
    contextWindow: 272000
    maxContextWindow: 1000000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-6.1 Terra (Bedrock GA 2026-10-26) — us-east-1 endpoint ONLY (404 "model
  # does not exist" on us-east-2 / us-west-2, live-probed 2026-10-27). On
  # us-east-1: plain, reasoning.effort none/max, image ("Red"), tool call
  # (function_call) and implicit cache (turn 2 read 6014 tokens) all 200. Specs
  # follow the Bedrock model card (1,050,000 context / 128,000 max output);
  # effort / verbosity presets as GPT-6.1 Sol (no "none" preset).
  - id: openai.gpt-6.1-terra
    displayName: GPT-6.1 Terra
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
    maxOutputTokens: 128000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  - id: openai.gpt-6-luna
    displayName: GPT-6 Luna
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
    maxOutputTokens: 128000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 flagship.
  - id: openai.gpt-5.6-sol
    displayName: GPT-5.6 Sol
    endpoints:
      - https://bedrock-mantle.us-east-1.api.aws/openai/v1
      - https://bedrock-mantle.us-east-2.api.aws/openai/v1
    maxOutputTokens: 64000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # Output length of the final answer (Responses API `text.verbosity`),
      # separate from reasoning effort. `default` is what a new agent's
      # model.verbosity gets (scaffold / form); an agent.yaml without the
      # field sends low (MantleAgent's fallback — terse, best for tool turns).
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 balanced — official line: GPT-5.5-level performance at half the price.
  - id: openai.gpt-5.6-terra
    displayName: GPT-5.6 Terra
    maxOutputTokens: 64000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol above — final-answer length; new agents get the default, a yaml without it sends low.
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 fast / low-cost.
  - id: openai.gpt-5.6-luna
    displayName: GPT-5.6 Luna
    maxOutputTokens: 64000
    contextWindow: 272000
    maxContextWindow: 1050000
    compressAt: 0.9
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: xhigh
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol above — final-answer length; new agents get the default, a yaml without it sends low.
      verbosity:
        default: medium
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
