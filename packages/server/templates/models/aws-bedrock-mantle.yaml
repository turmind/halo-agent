id: aws-bedrock-mantle
displayName: AWS Bedrock Mantle (OpenAI GPT-6 / 5.6)
displayName_zh: AWS Bedrock Mantle（OpenAI GPT-6 / 5.6）
description: OpenAI GPT-6 (Astra / Sol / Luna) and GPT-5.6 (Sol / Terra / Luna) on Amazon Bedrock via the bedrock-mantle endpoint (OpenAI Responses API only — not Converse/InvokeModel). Region-split — GPT-6 Sol / Luna are on us-east-1 only, Astra on us-west-2 only.
description_zh: 通过 Bedrock Mantle 端点调用 OpenAI GPT-6（Astra / Sol / Luna）与 GPT-5.6（Sol / Terra / Luna）（仅 OpenAI Responses API，不支持 Converse/InvokeModel）。按区域分布：GPT-6 Sol / Luna 仅 us-east-1，Astra 仅 us-west-2。
# Mantle is a distinct endpoint from bedrock-runtime; the OpenAI surface lives
# under /openai/v1. Region split (live-probed 2026-09-24, 404 on the wrong
# endpoint):
#
#                us-east-1   us-east-2   us-west-2
#   gpt-6-astra      -           -           ✓
#   gpt-6-sol        ✓           -           -
#   gpt-6-luna       ✓           -           -
#   gpt-5.6-sol      ✓           ✓           -
#   gpt-5.6-terra    ✓           ✓           ✓
#   gpt-5.6-luna     ✓           ✓           ✓
#
# us-east-1 serves everything but Astra, so it is the default; existing
# us-east-2 configs (5.6-era) keep working; Astra users pick us-west-2 in the
# agent form. The endpoint is a per-agent pick.
#
# The same six models are also in aws-bedrock-openai.yaml (bedrock-runtime
# host, `global.openai.*` ids, no region split) — AWS's recommended endpoint
# for new agents. Stay here only for Mantle-only features (server-side
# web_search, background inference), which the web-search skill relies on.
defaultEndpoint: https://bedrock-mantle.us-east-1.api.aws/openai/v1
endpointPresets:
  - https://bedrock-mantle.us-east-1.api.aws/openai/v1
  - https://bedrock-mantle.us-east-2.api.aws/openai/v1
  - https://bedrock-mantle.us-west-2.api.aws/openai/v1

defaultModelId: openai.gpt-6-sol

# Auth: a Bedrock long-term API key passed as a Bearer token. Generate at
# console → Bedrock → API keys → long-term. The default placeholder reads the
# AWS_BEARER_TOKEN_BEDROCK env var; leave the env unset and fill the key in
# Settings to store it in secrets/settings.yaml instead. resolveApiKey() reads
# `api_key`, so the bearer token flows straight to the agent with no extra wiring.
secrets:
  - key: api_key
    description: Bedrock long-term API key (sent as a Bearer token). Defaults to the AWS_BEARER_TOKEN_BEDROCK env var.
    description_zh: Bedrock 长期 API Key（作为 Bearer 令牌发送）。默认读取 AWS_BEARER_TOKEN_BEDROCK 环境变量。
    default: <<AWS_BEARER_TOKEN_BEDROCK>>
    secret: true

# capability notes for Mantle/OpenAI:
#   - image: input only (text/image in, text-only out — no audio/video/image gen)
#   - promptCaching: AUTOMATIC (prefix ≥1024 tok, ~5min idle TTL). No cache_control
#     is sent and there's no 1h option — single 5m preset reflects reality, the
#     runtime never writes cache control, it only reads cached_tokens back.
#   - thinking: adaptive via reasoning.effort = low|medium|high|xhigh|max (no
#     budget_tokens mode). Live-endpoint finding (2026-02): `max` is accepted and
#     echoed back verbatim by all three 5.6 models, yet the model-level validation
#     error text (rejecting e.g. `minimal`) lists only none/low/medium/high/xhigh —
#     max works in practice but isn't on the official list. It is NOT silently
#     downgraded: measured ~6% more reasoning_tokens than xhigh on identical
#     prompts, so the tier reaches the model — a nudge, not a doubling. Note: Mantle
#     never surfaces reasoning summaries — output[].reasoning.summary stays empty
#     even with reasoning.summary=detailed (verified against the live endpoint;
#     reasoning_tokens > 0 proves thinking runs). So no thinking text is shown in
#     the UI; that's upstream behavior, not a parsing gap.
#   - maxOutputTokens for the 5.6 variants: not disclosed in the 5.6 model card —
#     conservatively carried over from GPT-5.5's 64000.
models:
  # GPT-6 Astra — OpenAI's current flagship (Bedrock GA 2026-09-08). us-west-2
  # endpoint ONLY (404 on us-east-2). Context 1,050,000 / max output 128,000
  # per the Bedrock model card + OpenAI model page. Live-probed 2026-09-13
  # with invalid-value requests: reasoning.effort accepts none/low/medium/
  # high/xhigh/max (`max` now on the official list, unlike 5.6), text.verbosity
  # accepts low/medium/high — same surface as 5.6, so MantleAgent needs no
  # change. Pricing note: input beyond 272K tokens bills at 2x, so the huge
  # window is a ceiling, not a free lunch — leave context.maxTokens unset in
  # agent.yaml only if you accept that.
  - id: openai.gpt-6-astra
    displayName: GPT-6 Astra
    maxOutputTokens: 128000
    contextWindow: 1050000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol below — final-answer length, default low, per-agent overridable.
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-6 Sol / Luna (Bedrock GA 2026-09-22) — us-east-1 endpoint ONLY (404 on
  # us-east-2 / us-west-2). Same 1,050,000 context / 128,000 max output as
  # Astra per the OpenAI model pages; live-probed 2026-09-24 on us-east-1 with
  # invalid-value requests: reasoning.effort accepts none/low/medium/high/
  # xhigh/max, text.verbosity accepts low/medium/high — identical surface, so
  # MantleAgent needs no change. Sol ($2/$10) is the coding/agentic tier and
  # the new default; Luna ($0.10/$0.50) is the high-volume tier. The 272K→2x
  # input-price step noted on Astra applies here too.
  - id: openai.gpt-6-sol
    displayName: GPT-6 Sol
    maxOutputTokens: 128000
    contextWindow: 1050000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  - id: openai.gpt-6-luna
    displayName: GPT-6 Luna
    maxOutputTokens: 128000
    contextWindow: 1050000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 flagship.
  - id: openai.gpt-5.6-sol
    displayName: GPT-5.6 Sol
    maxOutputTokens: 64000
    contextWindow: 272000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # Output length of the final answer (Responses API `text.verbosity`),
      # separate from reasoning effort. Default low = terse + cheaper, best for
      # tool-driven agent turns. Override per-agent via agent.yaml model.verbosity.
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 balanced — official line: GPT-5.5-level performance at half the price.
  - id: openai.gpt-5.6-terra
    displayName: GPT-5.6 Terra
    maxOutputTokens: 64000
    contextWindow: 272000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol above — final-answer length, default low, per-agent overridable.
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }

  # GPT-5.6 fast / low-cost.
  - id: openai.gpt-5.6-luna
    displayName: GPT-5.6 Luna
    maxOutputTokens: 64000
    contextWindow: 272000
    capabilities:
      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: adaptive
        defaultEnabled: true
        default: medium
        effortPresets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
          - { value: xhigh, label: XHigh }
          - { value: max, label: Max }
      # See GPT-5.6 Sol above — final-answer length, default low, per-agent overridable.
      verbosity:
        default: low
        presets:
          - { value: low, label: Low }
          - { value: medium, label: Medium }
          - { value: high, label: High }
