      image: true
      video: false
      audio: false
      promptCaching:
        default: 5m
        ttlPresets:
          - { value: 5m, label: 5min }
      thinking:
        mode: manual
        defaultEnabled: true
        default: high
        defaultBudgetTokens: 8192
        effortPresets:
          - { value: medium, label: Medium }
          - { value: high, label: High }

  - id: qwen3.7-max
    displayName: Qwen3.7 Max
    maxOutputTokens: 16384
    contextWindow: 272000
    maxContextWindow: 1000000
    compressAt: 0.9
    capabilities:
      image: false
      video: false
      audio: false
      promptCaching:
