displayName_zh: 预览扩展
description: Install / list / remove admin preview extensions.
description_zh: 安装 / 列出 / 删除管理后台的预览扩展。

params:
  - key: hub_repo
    description: "Hub that `models` pulls from (newest `models-v*` release zip): an https GitHub / Gitea / Forgejo / GitLab repo URL, or `owner/repo` for GitHub. Also where the default `hub_base` comes from. Empty = https://github.com/turmind/halo-hub."
    description_zh: "`models` 的来源仓库（取最新的 `models-v*` release zip）：https 的 GitHub / Gitea / Forgejo / GitLab 仓库地址，GitHub 可简写为 `owner/repo`。`hub_base` 的默认值也由它推出。留空 = https://github.com/turmind/halo-hub。"
    default: https://github.com/turmind/halo-hub
  - key: hub_base
    description: "https base URL holding `<id>/update.json` for every hub extension — where `install <id>` and the admin's update check (extensions without their own `source`) read from. Point it at a mirror (intranet server, S3, CDN). Empty = the GitHub raw `extensions/` directory on `main` of `hub_repo` (https://raw.githubusercontent.com/<owner>/<repo>/main/extensions); a non-GitHub `hub_repo` needs this set."
    description_zh: "存放各个 hub 扩展 `<id>/update.json` 的 https 基础地址，`install <id>` 和后台的检查更新（没写 `source` 的扩展）都从这里读。用镜像（内网服务器、S3、CDN）时改成镜像地址。留空 = `hub_repo` 在 GitHub 上 `main` 分支的 `extensions/` 目录（https://raw.githubusercontent.com/<owner>/<repo>/main/extensions）；`hub_repo` 不是 GitHub 时必须填写。"
    default: ""
