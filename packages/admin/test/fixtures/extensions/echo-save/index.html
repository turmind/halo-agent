<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Echo</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 ui-monospace, monospace; }
  body[data-theme="dark"] { background: #1e1e1e; color: #ddd; }
  body[data-theme="light"] { background: #fff; color: #222; }
  #status { padding: 4px 8px; opacity: .7; border-bottom: 1px solid currentColor; }
  textarea { display: block; width: 100%; height: calc(100% - 26px); box-sizing: border-box; border: 0; padding: 8px;
             background: transparent; color: inherit; font: inherit; resize: none; outline: none; }
</style>
</head>
<body data-theme="dark">
<!--
  Fixture for the canvas-extension host protocol (design §6). Not shipped:
  zip this directory and install it from Settings → Extensions to drive the
  host by hand. Every frame the host understands is exercised here:
    host → ext : init · load · save-request · saved · save-error · theme
    ext  → host: ready · dirty · save · error
-->
<div id="status">waiting for host…</div>
<textarea id="text" spellcheck="false"></textarea>
<script>
  var status = document.getElementById('status')
  var text = document.getElementById('text')
  var loadedText = ''
  var dirty = false

  function post(frame, transfer) { parent.postMessage(Object.assign({ haloExt: 1 }, frame), '*', transfer || []) }
  function setDirty(next) {
    if (dirty === next) return
    dirty = next
    post({ type: 'dirty', dirty: dirty })
  }
  function save() {
    var buffer = new TextEncoder().encode(text.value).buffer
    status.textContent = 'saving…'
    post({ type: 'save', buffer: buffer }, [buffer])
  }

  window.addEventListener('message', function (e) {
    var f = e.data
    if (!f || f.haloExt !== 1) return
    switch (f.type) {
      case 'init':
        document.body.dataset.theme = f.theme
        status.textContent = 'init: ' + f.file.path + ' (' + f.file.size + ' bytes, protocol ' + f.protocol + ', caps ' + f.capabilities.join(',') + ')'
        return
      case 'load':
        loadedText = new TextDecoder().decode(f.buffer)
        text.value = loadedText
        setDirty(false)
        status.textContent = 'loaded ' + f.buffer.byteLength + ' bytes, mtime ' + f.mtime
        return
      case 'save-request':
        save()
        return
      case 'saved':
        loadedText = text.value
        setDirty(false)
        status.textContent = 'saved, mtime ' + f.mtime
        return
      case 'save-error':
        status.textContent = 'save failed (' + f.reason + '): ' + f.message
        return
      case 'theme':
        document.body.dataset.theme = f.theme
        return
    }
  })

  text.addEventListener('input', function () { setDirty(text.value !== loadedText) })
  text.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (dirty) save() }
  })

  post({ type: 'ready', protocol: 1 })
</script>
</body>
</html>
