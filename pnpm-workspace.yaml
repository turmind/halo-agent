packages:
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - electron
  - esbuild
  - node-pty
  - sharp
# Security floors for transitive deps the direct dependents haven't bumped yet
# (pnpm audit --prod, high). Each is a patch-level bump the upstream range
# already permits or a minor with no API surface we touch; drop an entry once
# its parent picks up the fixed version on its own.
overrides:
  'axios@>=1.0.0 <1.15.1': ^1.20.0          # via @larksuiteoapi/node-sdk
  '@xmldom/xmldom@<0.8.13': ^0.8.15         # via mammoth
  'form-data@>=4.0.0 <4.0.6': ^4.0.6        # via axios
  'fast-xml-builder@<=1.1.6': ^1.3.1        # via @aws-sdk fast-xml-parser
  'browserslist@<=4.28.6': ^4.28.7          # via next
  'postcss@<=8.5.17': ^8.5.28               # via next
  'sharp@<0.35.4': ^0.35.4                  # via next
